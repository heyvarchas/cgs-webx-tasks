# Note: I've used AI heavily for this file and Dockerfile due to their complicated nature

version: "3.9"

services:
  # MongoDB Database Service
  mongo:
    image: mongo:6
    container_name: cgs_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: cgs-backend
    volumes:
      - mongo_data:/data/db
    networks:
      - cgs_network

  # Backend Node.js Service
  backend:
    build: .
    container_name: cgs_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/cgs-backend
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    depends_on:
      - mongo
    networks:
      - cgs_network

# Named volume for persistent MongoDB data
volumes:
  mongo_data:

# Shared network for both services
networks:
  cgs_network:
    driver: bridge